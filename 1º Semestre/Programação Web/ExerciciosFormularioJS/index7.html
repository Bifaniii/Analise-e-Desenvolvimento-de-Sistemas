<body>
    <form>
        <fieldset>
            <legend>Cálculo IMC</legend>

            <label for="sexo">Digite seu sexo (M ou F):</label>
            <input type="text" name="sexo" id="sexo">
            <br>
            <br>
            <label for="peso">Digite seu peso:</label>
            <input type="number" inputmode="decimal" step="0.01" name="peso" id="peso">
            <br>
            <br>
            <label for="peso">Digite sua altura em metros:</label>
            <input type="number" name="altura" id="altura">

            <button type="button" onclick="calcularIMC()">Calcular</button>
        </fieldset>
    </form>
    <div id="resultado"></div>
</body>
